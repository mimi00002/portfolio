<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image with Overlapping Text</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg">
    <div class="center-container">
        <div class="image-box">
            <svg width="340" height="340" class="profile-svg">
                <image href="img/catteee.png" x="0" y="0" width="340" height="340"/>
                <a xlink:href="menu.html" xmlns:xlink="http://www.w3.org/1999/xlink">
                    <text x="170" y="180" text-anchor="middle" font-size="32" fill="#222" font-family="Inter, Arial, sans-serif" class="profile-text">
                        Nattanon Sukmetta
                    </text>
                </a>
            </svg>
        </div>
    </div>
</body>
</html>
